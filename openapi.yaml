openapi: 3.0.3
info:
  title: Chatterisk
  version: 0.1.0
  description: >-
    Volume-adjusted social sentiment risk API for Ethereum and crypto token communities.
  x-product-slug: ai-decentralized-chatterisk
  x-source: ai-in-decentralized+ai/research-paper_1811.11136v1/
servers:
  - url: https://api.example.com
tags:
  - name: Projects
    description: Token and project registry
  - name: Comments
    description: Ingested social comments
  - name: Aggregates
    description: Volume-adjusted project scores
  - name: Alerts
    description: Threshold risk alerts
  - name: Dossiers
    description: Committee export packages
  - name: ExternalLinks
    description: Links to external vuln scans

paths:
  /v1/projects:
    get:
      operationId: listRiskProjects
      tags: [Projects]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Projects page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeRiskProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: registerRiskProject
      tags: [Projects]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskProjectCreate" }
      responses:
        "201":
          description: Project registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeRiskProject" }
  /v1/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRiskProject
      tags: [Projects]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeRiskProject" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/comments:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listProjectComments
      tags: [Comments]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Comments page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeSocialComment" }
    post:
      operationId: ingestComment
      tags: [Comments]
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialCommentCreate" }
      responses:
        "201":
          description: Comment ingested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeSocialComment" }
  /v1/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getComment
      tags: [Comments]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Comment with scores
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeSocialComment" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/aggregates:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listProjectAggregates
      tags: [Aggregates]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: window
          in: query
          schema: { type: string, enum: [1d, 7d, 30d] }
      responses:
        "200":
          description: Aggregates page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeProjectAggregate" }
  /v1/aggregates/latest:
    get:
      operationId: getLatestAggregate
      tags: [Aggregates]
      security: [{ ApiKeyAuth: [] }, { BearerAuth: [] }]
      parameters:
        - name: contractAddress
          in: query
          schema: { type: string }
        - name: projectId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Latest volume-adjusted score
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeProjectAggregate" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/alerts:
    get:
      operationId: listRiskAlerts
      tags: [Alerts]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Alerts page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeRiskAlert" }
    post:
      operationId: createAlertPolicy
      tags: [Alerts]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertPolicyCreate" }
      responses:
        "201":
          description: Alert policy created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeAlertPolicy" }
  /v1/alerts/{alertId}/acknowledge:
    parameters:
      - name: alertId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acknowledgeAlert
      tags: [Alerts]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeRiskAlert" }
  /v1/dossiers:
    post:
      operationId: createDossier
      tags: [Dossiers]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DossierExportCreate" }
      responses:
        "201":
          description: Dossier created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeDossierExport" }
    get:
      operationId: listDossiers
      tags: [Dossiers]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Dossiers page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeDossierExport" }
  /v1/dossiers/{dossierId}:
    parameters:
      - name: dossierId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDossier
      tags: [Dossiers]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeDossierExport" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/external-links:
    get:
      operationId: listExternalLinks
      tags: [ExternalLinks]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: projectId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: External links page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelopeExternalScanLink" }
    post:
      operationId: createExternalLink
      tags: [ExternalLinks]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalScanLinkCreate" }
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataEnvelopeExternalScanLink" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    RiskProject:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        ticker: { type: string }
        contractAddress: { type: string }
        aliases:
          type: array
          items: { type: string }
    RiskProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        ticker: { type: string }
        contractAddress: { type: string }
        aliases:
          type: array
          items: { type: string }
    SocialComment:
      type: object
      required: [id, projectId, channel, text]
      properties:
        id: { type: string }
        projectId: { type: string }
        channel: { type: string, enum: [twitter, telegram, facebook, other] }
        text: { type: string }
        tanhScore: { type: number, minimum: -1, maximum: 1 }
        positiveProbability: { type: number }
        negativeProbability: { type: number }
        botSuspect: { type: boolean }
        modelVersion: { type: string }
        disclaimer: { type: string, default: "Risk intelligence only; not investment advice." }
    SocialCommentCreate:
      type: object
      required: [channel, text]
      properties:
        channel: { type: string, enum: [twitter, telegram, facebook, other] }
        text: { type: string }
        externalId: { type: string }
        publishedAt: { type: string, format: date-time }
    ProjectAggregate:
      type: object
      required: [id, projectId, adjustedScore, sampleSize]
      properties:
        id: { type: string }
        projectId: { type: string }
        window: { type: string }
        rawMeanScore: { type: number }
        adjustedScore: { type: number }
        volumeWeight: { type: number }
        sampleSize: { type: integer }
        botDownweightedCount: { type: integer }
        modelVersion: { type: string }
        disclaimer: { type: string }
    RiskAlert:
      type: object
      required: [id, projectId, status]
      properties:
        id: { type: string }
        projectId: { type: string }
        kind: { type: string, enum: [score_drop, high_negativity, bot_surge] }
        status: { type: string, enum: [open, acknowledged, closed] }
        triggeredAt: { type: string, format: date-time }
    AlertPolicy:
      type: object
      required: [id, workspaceId, threshold]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        threshold: { type: number }
        window: { type: string }
    AlertPolicyCreate:
      type: object
      required: [workspaceId, threshold]
      properties:
        workspaceId: { type: string }
        threshold: { type: number }
        window: { type: string, default: 7d }
    DossierExport:
      type: object
      required: [id, projectId, status]
      properties:
        id: { type: string }
        projectId: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        status: { type: string, enum: [pending, ready, failed] }
        downloadUrl: { type: string, format: uri }
    DossierExportCreate:
      type: object
      required: [projectId, periodStart, periodEnd]
      properties:
        projectId: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
    ExternalScanLink:
      type: object
      required: [id, projectId, externalScanId]
      properties:
        id: { type: string }
        projectId: { type: string }
        externalScanId: { type: string }
        provider: { type: string }
        url: { type: string, format: uri }
    ExternalScanLinkCreate:
      type: object
      required: [projectId, externalScanId]
      properties:
        projectId: { type: string }
        externalScanId: { type: string }
        provider: { type: string }
        url: { type: string, format: uri }

    DataEnvelopeRiskProject:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/RiskProject" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeRiskProject:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/RiskProject" }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    DataEnvelopeSocialComment:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/SocialComment" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeSocialComment:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SocialComment" }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    DataEnvelopeProjectAggregate:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/ProjectAggregate" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeProjectAggregate:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ProjectAggregate" }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    DataEnvelopeRiskAlert:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/RiskAlert" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeRiskAlert:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/RiskAlert" }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    DataEnvelopeAlertPolicy:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AlertPolicy" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeAlertPolicy:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AlertPolicy" }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    DataEnvelopeDossierExport:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/DossierExport" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeDossierExport:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/DossierExport" }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    DataEnvelopeExternalScanLink:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/ExternalScanLink" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeExternalScanLink:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ExternalScanLink" }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
