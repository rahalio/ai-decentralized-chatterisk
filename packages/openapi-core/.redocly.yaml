apis:
  identity:
    root: src/identity.yaml
  projects:
    root: src/projects.yaml
  comments:
    root: src/comments.yaml
  aggregates:
    root: src/aggregates.yaml
  alerts:
    root: src/alerts.yaml
  dossiers:
    root: src/dossiers.yaml
  external-links:
    root: src/external-links.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
