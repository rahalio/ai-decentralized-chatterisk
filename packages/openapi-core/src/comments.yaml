openapi: 3.1.0
info:
  title: Comments API
  version: 0.1.0
  description: |
    Social ingest, comment evidence, bot rulings, and retention/redaction (BR-4, BR-8).
  x-domain: cmt
  license:
    name: Proprietary
servers:
  - url: https://api.chatterisk.local
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: Comments
    description: Ingested social comments
paths:
  /v1/projects/{projectId}/comments:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectComments
      tags: [Comments]
      summary: List comments for a project
      x-repository: Comment
      x-dynamodb:
        entityType: COMMENT
        pkPatternTemplate: 'COMMENT#${commentId}'
        skPatternTemplate: METADATA
        pkPattern: entity
        gsi1PKPatternTemplate: 'PROJECT#${projectId}'
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Comments page
          content:
            application/json:
              schema:
                $ref: ./comments.schemas.yaml#/components/schemas/SocialCommentListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: ingestComment
      tags: [Comments]
      summary: Ingest a social comment
      x-repository: Comment
      x-dynamodb:
        entityType: COMMENT
        pkPatternTemplate: 'COMMENT#${commentId}'
        skPatternTemplate: METADATA
        pkPattern: entity
        gsi1PKPatternTemplate: 'PROJECT#${projectId}'
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      security:
        - apiKey: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./comments.schemas.yaml#/components/schemas/SocialCommentCreate
      responses:
        '201':
          description: Comment ingested
          content:
            application/json:
              schema:
                $ref: ./comments.schemas.yaml#/components/schemas/SocialCommentResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema:
          $ref: ./comments.schemas.yaml#/components/schemas/CommentId
    get:
      operationId: getComment
      tags: [Comments]
      summary: Get comment evidence
      x-repository: Comment
      x-dynamodb:
        entityType: COMMENT
        pkPatternTemplate: 'COMMENT#${commentId}'
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Comment
          content:
            application/json:
              schema:
                $ref: ./comments.schemas.yaml#/components/schemas/SocialCommentResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/comments/{commentId}/redact:
    post:
      operationId: redactCommentPii
      tags: [Comments]
      summary: Redact PII on a comment (BR-8)
      x-repository: Comment
      x-dynamodb:
        entityType: COMMENT
        pkPatternTemplate: 'COMMENT#${commentId}'
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            $ref: ./comments.schemas.yaml#/components/schemas/CommentId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Redacted
          content:
            application/json:
              schema:
                $ref: ./comments.schemas.yaml#/components/schemas/SocialCommentResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/comments/{commentId}/bot-ruling:
    post:
      operationId: applyCommentBotRuling
      tags: [Comments]
      summary: Mark coordinated inauthentic / bot (BR-4)
      x-repository: BotRuling
      x-dynamodb:
        entityType: BOT_RULING
        pkPatternTemplate: 'BOT_RULING#${rulingId}'
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            $ref: ./comments.schemas.yaml#/components/schemas/CommentId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./comments.schemas.yaml#/components/schemas/BotRulingCreate
      responses:
        '201':
          description: Ruling applied
          content:
            application/json:
              schema:
                $ref: ./comments.schemas.yaml#/components/schemas/BotRulingResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/bot-rulings:
    get:
      operationId: listBotRulings
      tags: [Comments]
      summary: List bot / inauthentic rulings
      x-repository: BotRuling
      x-dynamodb:
        entityType: BOT_RULING
        pkPatternTemplate: 'BOT_RULING#${rulingId}'
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Rulings page
          content:
            application/json:
              schema:
                $ref: ./comments.schemas.yaml#/components/schemas/BotRulingListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/comments/retention:
    get:
      operationId: getCommentRetentionPolicy
      tags: [Comments]
      summary: Get raw-comment retention policy
      x-repository: Retention
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema:
                $ref: ./comments.schemas.yaml#/components/schemas/RetentionPolicyResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    put:
      operationId: updateCommentRetentionPolicy
      tags: [Comments]
      summary: Update retention policy
      x-repository: Retention
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./comments.schemas.yaml#/components/schemas/RetentionPolicy
      responses:
        '200':
          description: Policy saved
          content:
            application/json:
              schema:
                $ref: ./comments.schemas.yaml#/components/schemas/RetentionPolicyResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/comments/retention/run:
    post:
      operationId: runCommentRetentionJob
      tags: [Comments]
      summary: Run redaction / purge job
      x-repository: Retention
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: ./comments.schemas.yaml#/components/schemas/RetentionJobResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
